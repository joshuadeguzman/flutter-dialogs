name: flutter_dialogs
description: Platform-aware dialogs, alerts, confirmations and action sheets. Cupertino on iOS and macOS, Material everywhere else, from one API.
version: 4.0.0
homepage: https://github.com/joshuadeguzman/flutter-dialogs
repository: https://github.com/joshuadeguzman/flutter-dialogs
issue_tracker: https://github.com/joshuadeguzman/flutter-dialogs/issues
topics:
  - dialog
  - alert
  - cupertino
  - material
  - adaptive

screenshots:
  - description: Alert on iOS and Android.
    path: .github/screenshots/alert.png
  - description: Destructive confirmation on iOS and Android.
    path: .github/screenshots/confirmation.png
  - description: Action sheet on iOS and Android.
    path: .github/screenshots/action_sheet.png

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
